name: Issue 45 safe lockfile validation

on:
  push:
    branches:
      - test/issue-45-safe-validation

permissions:
  contents: read

jobs:
  lockfile-workspaces-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check locked install, workspaces, lint, and lockfile stability
        env:
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          before="$(sha256sum package-lock.json | cut -d ' ' -f1)"
          npm ci --no-audit --no-fund
          npm ls --workspace=@promiscope/indexer --depth=0
          npm ls --workspace=@promiscope/contract-events --depth=0
          npm run lint
          after="$(sha256sum package-lock.json | cut -d ' ' -f1)"
          printf 'lockfile before=%s after=%s\n' "$before" "$after"
          test "$before" = "$after"
          git diff --exit-code -- package-lock.json
